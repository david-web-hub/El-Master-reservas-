<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="robots" content="noindex">
<!-- Payphone valida el dominio de origen de la Cajita: recomienda enviar al menos el origen. -->
<meta name="referrer" content="origin-when-cross-origin">
<title>MF Plux | Pago de suscripción</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d4af37'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23111' font-family='Arial' font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #080a0c;
  --panel: #101419;
  --line: #252c34;
  --gold: #d4af37;
  --gold2: #f4c94d;
  --text: #f7f7f7;
  --muted: #9da6af;
  --green: #32c778;
  --red: #ed5a5a;
  --radius: 18px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: radial-gradient(circle at top right, #17202a 0, #090b0e 35%, #060708 100%);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.caja { width: 100%; max-width: 460px; }
.marca { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.logo {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--gold2), #c99b22); color: #090909;
  font-size: 17px; font-weight: 900; letter-spacing: .02em;
}
.marca strong { display: block; letter-spacing: .08em; font-size: 15px; }
.marca span { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
h1 { font-size: 21px; margin: 0 0 6px; }
p { color: var(--muted); line-height: 1.5; margin: 8px 0; }
.precio { font-size: 30px; font-weight: 800; margin: 10px 0 2px; }
.precio small { font-size: 14px; color: var(--muted); font-weight: 500; }
.aviso { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 12px 0; }
.aviso.pruebas { background: #2a2410; border: 1px solid #6b5a1f; color: #f4dc8f; }
.aviso.ok { background: #10291c; border: 1px solid #1f6b43; color: #8fe0b4; }
.aviso.error { background: #2d1416; border: 1px solid #6b2328; color: #f2a5a5; }
.oculto { display: none; }
#pp-button { margin-top: 16px; min-height: 40px; }
a.volver { display: inline-block; margin-top: 16px; color: var(--gold2); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main class="caja">
  <div class="marca">
    <div class="logo" aria-hidden="true">MF</div>
    <div><strong>MF PLUX</strong><span>Pago de suscripción</span></div>
  </div>

  <section class="card" id="vista-pago">
    <h1 id="titulo">Preparando el pago…</h1>
    <div id="precio" class="precio oculto"></div>
    <div id="modo" class="aviso pruebas oculto">Modo de pruebas: no se realiza ningún cobro real.</div>
    <p id="detalle"></p>
    <div id="estado" class="aviso oculto" role="status"></div>
    <div id="pp-button"></div>
    <p class="nota">Los datos de tu tarjeta los recibe Payphone en su formulario seguro. MF Plux no los ve ni los guarda.</p>
    <a class="volver" href="/admin.html#planes">← Volver a Planes</a>
  </section>
</main>
<script src="/pago.js" defer></script>
</body>
</html>
